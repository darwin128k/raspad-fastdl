name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 ninja-build
      - name: C formatting
        run: |
          python3 -m pip install clang-format==18.1.8
          python3 scripts/check_format.py
      - name: Build and integration tests
        run: |
          cmake -S . -B build-linux32 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux32 -j2
          ctest --test-dir build-linux32 --output-on-failure
          cmake --install build-linux32 --component fastdl --prefix "$PWD/dist/linux32"
      - name: Updated Authum host and tests
        run: |
          cmake -S lib/authum -B build-authum -G Ninja -DCMAKE_BUILD_TYPE=Release -DAUTHUM_BUILD_EXAMPLES=OFF -DAUTHUM_BUILD_API_DOCS=OFF
          cmake --build build-authum -j2
          ctest --test-dir build-authum --output-on-failure
          python3 scripts/package.py
      - name: Sanitizers
        run: |
          cmake -S . -B build-sanitize -G Ninja -DFASTDL_BUILD_MODULE=OFF -DFASTDL_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-sanitize -j2
          ctest --test-dir build-sanitize --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: fastdl-linux
          path: dist/linux32/

  windows:
    name: Windows i686 (MSYS2 MinGW)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSYS2 MINGW32
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            zip

      - name: Build and tests
        run: |
          cmake -S . -B build-win32 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win32 -j"$(nproc)"
          ctest --test-dir build-win32 --output-on-failure
          cmake --install build-win32 --component fastdl --prefix "$PWD/dist/win32"

      - uses: actions/upload-artifact@v4
        with:
          name: fastdl-win32
          path: dist/win32/
