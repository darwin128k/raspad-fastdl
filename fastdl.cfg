# ======================================================================
# FastDL - HTTP resource downloads for GoldSrc
# ======================================================================
# key = value. Comments on separate lines; values without quotes.

# --- Network ----------------------------------------------------------
# 127.0.0.1 = local only. Set 0.0.0.0 for external connections.
bind = 127.0.0.1
port = 17015

# --- Download sources -------------------------------------------------
# Checked in order; the first available allowed file wins.
# Each source is a resource tree: maps/, models/, sound/, ...
# {game}   = game directory provided by Authum (e.g. cstrike)
# {module} = this module directory
# {data}   = this module's data directory
# Repeat source for additional trees; no resource copies are needed.
source = {game}
# source = {data}/public
# source = {game}/custom/resources
# Plain relative paths start from {module}. Maximum: 16 sources.

# --- Allowed resources ------------------------------------------------
# Space-separated top-level directories and file extensions.
# No directory listings, hidden components or symlinks.
# Root-level files: WAD only. Names are case-sensitive.
allow_dirs = maps models sound sprites gfx overviews
allow_extensions = bsp mdl wav mp3 spr tga bmp txt res wad

# Optional excluded paths/subtrees, for example:
# deny_prefixes = maps/private models/internal
deny_prefixes =

# --- Connections ------------------------------------------------------
# Log connections, requests and outcomes through Authum (0 disables).
access_log = 1

max_clients = 64
per_ip = 4
requests_per_second = 20
timeout_seconds = 15

# --- Transfer limits --------------------------------------------------
# Global budget: 8 MiB/s. Maximum file size: 128 MiB. No compression.
bytes_per_second = 8388608
max_file_bytes = 134217728

# --- CPU --------------------------------------------------------------
# -1 inherits affinity. Otherwise select an available logical CPU index.
cpu = -1
