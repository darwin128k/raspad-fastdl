# ======================================================================
# FastDL - HTTP resource downloads for GoldSrc
# ======================================================================
# key = value. Comments on separate lines; values without quotes.

# --- Network ----------------------------------------------------------
# 127.0.0.1 = local only. Set 0.0.0.0 for external connections.
bind = 127.0.0.1
port = 17015

# --- Download sources -------------------------------------------------
# Checked in order; the first available allowed file wins.
# Each source is a resource tree: maps/, models/, sound/, ...
# Placeholders come from Authum:
# {game}   = game directory (e.g. cstrike)
# {module} = this module directory
# {data}   = this module's data directory
# Repeat source for additional trees; no resource copies are needed.
source = {game}
# source = {data}/public
# source = {game}/custom/resources
# Plain relative paths start from {module}. Maximum: 16 sources.
# Keep sources on a local disk: a network share that stops answering
# stalls the HTTP worker (the game thread waits at most 1 s on unload).
# 'root' is the old single-source key; it is ignored once source is set.

# --- Allowed resources ------------------------------------------------
# Space-separated top-level directories and file extensions (written
# without a dot). The policy compares them without case; whether the file
# name itself matches case depends on the filesystem (Linux: exact case).
# URLs are %-decoded once; ?query and #fragment are ignored.
# No directory listings, hidden components or symlinks.
# Root-level files: WAD only.
allow_dirs = maps models sound sprites gfx overviews
allow_extensions = bsp mdl wav mp3 spr tga bmp txt res wad

# Optional excluded paths/subtrees, for example:
# deny_prefixes = maps/private models/internal
deny_prefixes =

# --- Connections ------------------------------------------------------
# 0 off; 1 one line per request (refusals at most 20/s, with a summary
#   line per second of what was refused); 2 also connect/request lines.
access_log = 1

max_clients = 64
per_ip = 4
# Connections per address whose request has not arrived yet. When every
# slot is taken, the oldest such connection (older than 250 ms) is dropped.
per_ip_pending = 4
requests_per_second = 20
timeout_seconds = 15

# Behind a reverse proxy: its addresses or CIDR blocks, space separated.
# Only for these peers is X-Forwarded-For used (rightmost untrusted hop),
# and limits apply to that client. Empty: the header is ignored.
# trusted_proxy = 127.0.0.1
trusted_proxy =

# --- Transfer limits --------------------------------------------------
# Global budget: 8 MiB/s. Maximum file size: 128 MiB. No compression.
bytes_per_second = 8388608
max_file_bytes = 134217728

# --- CPU --------------------------------------------------------------
# -1 inherits affinity. Otherwise select an available logical CPU index.
cpu = -1
